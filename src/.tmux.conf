# Shared through the dotfiles repository.  Put machine-specific lines,
# such as a status color, in ~/.tmux.conf.local, which is loaded last.

# Set prefix to C-o.  C-o C-o reaches an inner (nested) tmux.
set -g prefix C-o
unbind C-b
bind C-o send-prefix
# The default for ESC is too slow for emacs usage
set -s escape-time 10
# Try to use just 256 colors because of Terminal.app
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Allows scroll with mouse, and copy/paste
set -g mouse on
# Allow focus events to go to the underlying terminal.
set -g focus-events on
# Lets modified keys, such as Shift+Enter, through.
set -g extended-keys on

# The default of 2000 lines is short for Claude output.
set -g history-limit 50000

# Copies the tmux clipboard to the Mac clipboard.  Over SSH, this is the
# remote Mac's clipboard: Terminal.app ignores OSC 52, so a selection
# cannot reach the local clipboard.  Turn off View > Allow Mouse
# Reporting (Cmd-R) and use Cmd-C instead.
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Show the host and session in the status bar and the window title.
set -g status-left "[#{host_short}:#S] "
set -g status-left-length 30
set -g set-titles on
set -g set-titles-string "#{host_short}:#S"

source-file -q ~/.tmux.conf.local
